name: Tests

# Testing Strategy:
# - Tests run on Linux, macOS, and Windows (database drivers must work cross-platform)
# - Go 1.25+ required (matches go.mod requirement)
# - Multi-database support: PostgreSQL, MySQL, SQLite
# - Zero production dependencies
#
# Branch Strategy (GitHub Flow):
# - main branch: the only long-lived branch (protected by a ruleset)
# - feature/fix branches: merged into main through pull requests that pass CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# CI Strategy (2025 best practice):
# - push: only main branch and tags (post-merge validation)
# - pull_request: all PRs to main (pre-merge validation)
# - feature/fix branches tested via PR, no duplicate runs
# Reference: https://adamj.eu/tech/2025/05/14/github-actions-avoid-simple-on/

jobs:
  # Static analysis - Run once on Linux (OS-independent)
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "go.sum"

    - name: Download dependencies
      run: |
        go mod download
        go mod verify

    - name: Run go vet
      run: |
        go vet $(go list ./... | grep -v "/test")

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

    # The integration test module is a separate module behind the
    # "integration" build tag: vet and lint it too (CHORE-001).
    - name: Run go vet on the integration test module
      working-directory: test
      run: go vet -tags=integration ./...

    - name: Run golangci-lint on the integration test module
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        working-directory: test
        args: --timeout=5m --build-tags=integration

    - name: Check code formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'gofmt -w .' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted ✓"

  # Unit tests - Cross-platform (behavioral differences matter)
  unit-tests:
    name: Unit Tests - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # see integration-tests
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25']  # Match go.mod requirement

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: "go.sum"

    - name: Download dependencies
      shell: bash
      run: |
        go mod download
        go mod verify

    - name: Build all packages
      shell: bash
      run: |
        # Build main module (exclude integration test submodule)
        BUILDABLE=$(go list -f '{{if (and (or .GoFiles .CgoFiles) (not .Module))}}{{.ImportPath}}{{end}}' ./... 2>/dev/null | \
                    grep -v "github.com/coregx/relica/test" || true)

        if [ -n "$BUILDABLE" ]; then
          echo "Building: $BUILDABLE"
          go build -v $BUILDABLE
        else
          echo "No buildable packages"
        fi

    - name: Run unit tests with race detector
      shell: bash
      run: |
        # Run tests with race detector and coverage
        # Exclude integration test submodule
        go test -v -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v "github.com/coregx/relica/test")

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        flags: unittests
        name: codecov-unit
        fail_ci_if_error: false
        verbose: true

  # Integration tests - PostgreSQL and MySQL via services
  integration-tests:
    name: Integration Tests - ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      # Each database reports on its own: a PostgreSQL failure must not cancel
      # the MySQL job and hide its result.
      fail-fast: false
      matrix:
        database: [postgres, mysql]

    # Databases are started by testcontainers inside the test binary: every
    # Setup*TestDB call gets a fresh container, which is the isolation the
    # suite relies on (tables are shared by name across files). A job-level
    # `services:` block would be a second, unused database.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "test/go.sum"

    - name: Download integration test dependencies
      working-directory: test
      run: |
        go mod download
        go mod verify

    # Every test runs; RELICA_TEST_DB makes the Setup helpers skip the other
    # databases and turns a container that fails to start into a test failure.
    # (A -run name filter missed tests named *_PostgreSQL and every
    # multi-database test, whose databases are subtests.)
    - name: Run ${{ matrix.database }} integration tests
      working-directory: test
      env:
        RELICA_TEST_DB: ${{ matrix.database }}
      # Every test starts its own container: the default 10m test timeout
      # is too short for the whole suite.
      run: |
        go test -v -count=1 -timeout=45m -tags=integration ./...

  # Upsert and the rest of the MySQL suite on the newest MySQL release
  # (ADR-019): the day a server rejects VALUES() in ON DUPLICATE KEY UPDATE,
  # this job fails before users do. Not a required check: a new MySQL
  # release must not block merges, but the failure is visible.
  integration-tests-mysql-latest:
    name: Integration Tests - mysql (latest release)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "test/go.sum"

    - name: Download integration test dependencies
      working-directory: test
      run: |
        go mod download
        go mod verify

    - name: Run MySQL integration tests on mysql:latest
      working-directory: test
      env:
        RELICA_TEST_DB: mysql
        RELICA_MYSQL_IMAGE: mysql:latest
      run: |
        go test -v -count=1 -timeout=45m -tags=integration ./...

  # Integration tests - SQLite (embedded, no container needed)
  integration-tests-sqlite:
    name: Integration Tests - sqlite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "test/go.sum"

    - name: Download integration test dependencies
      working-directory: test
      run: |
        go mod download
        go mod verify

    - name: Run SQLite integration tests
      working-directory: test
      env:
        RELICA_TEST_DB: sqlite
      run: |
        go test -v -count=1 -tags=integration ./...

    # Separate module: lib/pq v1.2.0 (error code in a struct field) cannot share
    # test/go.mod with lib/pq v1.10.9, and mattn/go-sqlite3 needs cgo.
    - name: Driver compatibility (lib/pq v1.2.0, mattn/go-sqlite3)
      working-directory: test/drivercompat
      env:
        CGO_ENABLED: '1'
      run: |
        go mod download
        go mod verify
        go test -v -count=1 ./...

  # Benchmarks
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "go.sum"

    - name: Run benchmarks
      run: |
        echo "==> Running benchmarks"
        go test -bench=. -benchmem ./benchmark/... 2>&1 | grep -E "(^Benchmark|^PASS|^FAIL|ns/op|B/op)"

  # Test coverage check
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: "go.sum"

    - name: Run tests with coverage
      run: |
        go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: Check coverage threshold
      run: |
        # Calculate total coverage
        total_coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total_coverage}%"

        # Fail if coverage is below 70%
        if (( $(echo "$total_coverage < 70.0" | bc -l) )); then
          echo "ERROR: Coverage ${total_coverage}% is below minimum threshold of 70%"
          exit 1
        fi

        echo "Coverage check passed ✓"
